name: Weekly Bird Provisioning

on:
  schedule:
    # 00:07 America/Chicago Monday — aligns with weekly challenge rollover; off-minute reduces GitHub queue load
    - cron: '7 0 * * 1'
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      fake_count:
        description: 'Number of new fake birds to generate'
        type: number
        default: 100
      dry_run:
        description: 'Skip CDN writes and PR creation (catalog export + merge still run)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-bird-provisioning
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Job 1a: Export preview real-bird catalog
# ---------------------------------------------------------------------------
jobs:
  export-dev:
    name: Export preview bird catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Preview – real-fake-birds

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export preview real-bird catalog
        run: npx tsx scripts/export-real-birds.ts --env dev
        env:
          DEV_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload dev catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-birds-catalog
          path: scripts/data/dev-birds.json
          retention-days: 3

# ---------------------------------------------------------------------------
# Job 1b: Export production real-bird catalog (runs in parallel with 1a)
# ---------------------------------------------------------------------------
  export-prod:
    name: Export production bird catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production – real-fake-birds

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export production real-bird catalog
        run: npx tsx scripts/export-real-birds.ts --env prod
        env:
          PROD_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload prod catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-birds-catalog
          path: scripts/data/prod-birds.json
          retention-days: 3

# ---------------------------------------------------------------------------
# Job 2: Merge catalogs — download export artifacts and produce seed-birds.json
# ---------------------------------------------------------------------------
  merge-catalogs:
    name: Merge bird catalogs
    needs: [export-dev, export-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production – real-fake-birds

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dev catalog
        uses: actions/download-artifact@v4
        with:
          name: dev-birds-catalog
          path: scripts/data/

      - name: Download prod catalog
        uses: actions/download-artifact@v4
        with:
          name: prod-birds-catalog
          path: scripts/data/

      - name: Merge catalogs into seed-birds.json
        run: npx tsx scripts/export-real-birds.ts --merge-only

      - name: Upload merged catalogs
        uses: actions/upload-artifact@v4
        with:
          name: merged-catalogs
          path: |
            scripts/data/dev-birds.json
            scripts/data/prod-birds.json
            scripts/data/seed-birds.json
          retention-days: 3

# ---------------------------------------------------------------------------
# Job 3a: Seed real birds
# Runs in parallel with Job 3b after merge-catalogs completes.
# Missing Wikipedia data (no image/summary) exits 0 with a warning — only
# genuine infrastructure or processing errors cause a non-zero exit.
# ---------------------------------------------------------------------------
  seed-real:
    name: Seed real birds
    needs: [merge-catalogs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production – real-fake-birds

    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download merged catalogs
        uses: actions/download-artifact@v4
        with:
          name: merged-catalogs
          path: scripts/data/

      - name: Seed real birds (skip existing)
        if: ${{ env.DRY_RUN != 'true' }}
        run: npx tsx scripts/seed-cdn.ts --skip-existing
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload seed run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-run-reports
          path: scripts/.tmp/seed-cdn-runs/
          if-no-files-found: ignore
          retention-days: 30

# ---------------------------------------------------------------------------
# Job 3b: Generate and seed fake birds (runs in parallel with Job 3a)
# ---------------------------------------------------------------------------
  seed-fake:
    name: Generate and seed fake birds
    needs: [merge-catalogs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production – real-fake-birds

    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      FAKE_COUNT: ${{ github.event.inputs.fake_count || 100 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download merged catalogs
        uses: actions/download-artifact@v4
        with:
          name: merged-catalogs
          path: scripts/data/

      - name: Generate new fake birds
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          mkdir -p scripts/.tmp
          npx tsx scripts/generate-fake-birds.ts \
            --count ${{ env.FAKE_COUNT }} \
            --seed \
            --new-birds-out scripts/.tmp/new-birds.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Moderate and quarantine new fake birds
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          npx tsx scripts/validate-fake-birds.ts \
            --birds-file scripts/.tmp/new-birds.json \
            --quarantine-max ${{ env.FAKE_COUNT }} \
            --moderate-text \
            --moderate-images \
            --quarantine
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload moderation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moderation-report
          path: scripts/.tmp/fake-bird-validation-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload fake-birds data
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fake-birds-data
          path: scripts/data/fake-birds.json
          if-no-files-found: ignore
          retention-days: 3

# ---------------------------------------------------------------------------
# Job 4: Finalize — regenerate manifest, commit, create PR
# Runs after both seeding jobs. Skipped only if seed-fake failed or the
# workflow was cancelled.
# ---------------------------------------------------------------------------
  finalize:
    name: Finalize and create PR
    needs: [seed-real, seed-fake]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production – real-fake-birds
    if: ${{ !cancelled() && needs.seed-fake.result == 'success' }}

    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      FAKE_COUNT: ${{ github.event.inputs.fake_count || 100 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download merged catalogs
        uses: actions/download-artifact@v4
        with:
          name: merged-catalogs
          path: scripts/data/

      - name: Download fake-birds data
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fake-birds-data
          path: scripts/data/

      - name: Regenerate CDN manifest
        run: npx tsx scripts/score-fake-birds.ts

      - name: Configure git identity
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit data and manifest
        id: commit
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          BRANCH="automation/bird-provisioning-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add \
            scripts/data/dev-birds.json \
            scripts/data/prod-birds.json \
            scripts/data/seed-birds.json \
            scripts/data/fake-birds.json \
            src/lib/server/cdn-manifest.ts
          if git diff --cached --quiet; then
            echo "No changes to commit — all birds already up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(birds): weekly bird provisioning $(date -u +%Y-%m-%d)"
            git push origin "$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create auto-merge PR
        if: ${{ env.DRY_RUN != 'true' && steps.commit.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            Automated weekly bird provisioning.

            - Exported real-bird catalogs from preview and production Supabase
            - Seeded any missing real-bird CDN assets (partial failures are non-blocking)
            - Generated and seeded ${{ env.FAKE_COUNT }} new fake birds
            - Moderated new fake birds; quarantined any flagged outputs
            - Regenerated CDN manifest with updated plausibility scores

            Moderation report and seed run reports are attached as workflow artifacts.
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"
          TODAY="$(date -u +%Y-%m-%d)"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(birds): weekly bird provisioning ${TODAY}" \
            --body "$PR_BODY"
          gh pr merge --auto --squash
